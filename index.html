<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bezier View</title>
    </head>
    <body>
        <div id="container"></div>
        <input id="fileInput" type="file" style="visibility:hidden;position: absolute;" />
        <style>
            body {
                margin: 0;
                overflow: hidden;
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
                  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
                  "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.js",
                  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
                  "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20/+esm"
                }
              }
        </script>
        <script type="module">
            import * as THREE from 'three';
            import {BvLoader} from './BvLoader.js';
            import {globalState, setupGui, loadFile, gui} from './stateManager.js';
            import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
            import { BvPatch } from './BvPatch.js';
            let camera, scene, renderer, light, controls, time = 0;
            let bvPatch;
            let bvModel; // hold the currently loaded model
            let bvLoader;
            const clock = new THREE.Clock();
            function init(){

                // GUI

                setupGui();

                // CAMERA

                camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 10000 );
                camera.position.set( - 5, 5, 5 );

                // SCENE

                scene = new THREE.Scene();
                scene.background = new THREE.Color( 0xeeeeee );

                const gridHelper = new THREE.PolarGridHelper( 2, 16 );
	            scene.add( gridHelper );

                // LIGHTS

                light = new THREE.DirectionalLight( 0xffffff, 5 );
                light.position.set( 0.5, 1, 0.5 );
                scene.add( light );

                // RENDERER

                renderer = new THREE.WebGPURenderer();
                renderer.setPixelRatio( window.devicePixelRatio );
                renderer.setSize( window.innerWidth, window.innerHeight );
                renderer.setAnimationLoop( animate );
                container.appendChild( renderer.domElement );

                // CONTROLS

			    controls = new OrbitControls( camera, renderer.domElement );

                // EVENTS

			    window.addEventListener( 'resize', onWindowResize );

                // File loader
                bvLoader = new BvLoader(THREE.DefaultLoadingManager, renderer);
                let chooseModelHandle = gui.children[0].children[0];

                function updateGUIAfterLoad(newModel) {
                    let groupSettingsLocal = {};
                    groupSettingsLocal["All Groups"] = structuredClone(globalState.groupSettings["All Groups"]);

                    // create a new entry for each of the groups found
                    bvModel.children.forEach(group => {
                        groupSettingsLocal[group.name] = structuredClone(groupSettingsLocal["All Groups"]);
                    })
                    // and add those new entries as options in the list
                    let groupHandle = gui.children.find((folder) => folder._title === "Groups").children.find((controller) => controller._name === "Group");

                    // update the real global state with the new information
                    globalState.groupSettings = structuredClone(groupSettingsLocal);
                    globalState.activeGroup = 'All Groups';
                    groupHandle.options(Object.keys(globalState.groupSettings));
                }

                // wrapper around the BvLoader "load" function
                function loadLocalModel(url) {
                    bvLoader.load(url, ((model) => {
                        if (bvModel)
                            scene.remove(bvModel);

                        bvModel = model;
                        scene.add(bvModel);
                        updateGUIAfterLoad(bvModel);
                    }));
                }

                // Listen for when a file is uploaded by the user
                document.getElementById('fileInput').addEventListener('change', (event) => {
                    const file = event.target.files[0];

                    if (!file) {
                        console.log("Error loading file");
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        let oldModel = bvModel;
                        bvModel = bvLoader.parse(event.target.result);
                        // if there was an old model, and parsing succeeded, remove it
                        if (oldModel)
                            scene.remove(oldModel);
                        scene.add(bvModel);
                        updateGUIAfterLoad(bvModel);
                    }
                    reader.readAsText(file);
                });

                // Listen for when the user selects one of the preset models
                let presets = gui.children.find((folder) => folder._title === "Load File").children.find((controller) => controller._name === "Choose Model");
                presets.onChange((event) => {
                    switch(event) {
                        case "Logo":
                            loadLocalModel("./data/logo.bv");
                            break;
                        case "Teapot":
                            loadLocalModel("./data/tpt_grp.bv");
                            break;
                        case "Hexoid":
                            loadLocalModel("./data/hex.bv");
                            break;
                        case "Cube, G2":
                            loadLocalModel("./data/cubeg2.bv");
                            break;
                        case "Male Head":
                            loadLocalModel("./data/male_head.bv");
                            break;
                    }
                });

                // Set model to logo by default
                // TODO: this is quite slow; parsing is fast but adding 540 new patch objects to the scene is not
                loadLocalModel('./data/logo.bv');

                // TODO: pass initial patch subdiv level to the BvLoader or, after loading, set the level of all patches
                // to the currently selected level

                //Test
                gui.add({'level': 1}, 'level', 0, 6, 1).name('Patch Level').onChange((value) => {
                    bvModel.children.forEach(group => {
                        group.children.forEach(patch => {
                            patch.setLevel(value);
                        })
                    })
                });
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize( window.innerWidth, window.innerHeight );
            }

            function animate() {
                render();
            }

            function render() {

                const delta = clock.getDelta();
                time += delta;
                // render
                renderer.render( scene, camera );
            }

            init();

        </script>
    </body>
</html>
