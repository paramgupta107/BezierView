                function loadBVFile(event) {
                    const file = event.target.files[0];

                    if (!file) {
                        console.log("Error loading file");
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        console.log("file loaded");

                        // remove the old model (if there is one)
                        if (bvModel)
                            scene.remove(bvModel);

                        // just the bv file's text
                        const text = event.target.result;
                        bvModel = bvLoader.parse(text);
                        scene.add(bvModel);

                        // TODO: update the GUI now that a new model has been loaded (groups section, etc)
                    }
                    reader.readAsText(file);

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize( window.innerWidth, window.innerHeight );
            }

            function animate() {
                render();
            }

            function render() {

                const delta = clock.getDelta();
                time += delta;
                // render
                renderer.render( scene, camera );
